  ansible.builtin.command: "grep -F -- {{ config_line | quote }} {{ config_file | quote }}"
  changed_when: false
  when: remediation_action == 'set_config_line'
)
        | first
      }}
  when: remediation_action == 'disable_vsftpd_anonymous'

- name: Require unambiguous systemd ownership of every TCP listener
  ansible.builtin.assert:
    that:
      - service_port_listener_lines | length > 0
      - >-
        (
          service_port_listener_lines
          | reject('search', 'users:\\(\\("vsftpd",pid=' ~ service_main_pid ~ ',fd=[0-9]+\\)\\)')
          | list
          | length
        ) == 0
      - >-
        (
          service_port_listener_lines
          | select('search', 'pid=[0-9]+')
          | list
          | length
        ) == service_port_listener_lines | length
      - >-
        (
          service_port_listener_lines
          | select('search', 'pid=(?!' ~ service_main_pid ~ '[,])')
          | list
          | length
        ) == 0
    fail_msg: TCP listener ownership does not match the validated systemd service
  when: remediation_action == 'disable_vsftpd_anonymous'

- name: Count active vsftpd anonymous access directives
