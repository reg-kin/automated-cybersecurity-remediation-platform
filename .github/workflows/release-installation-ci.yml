name: Release installation regression

on:
  push:
    branches:
      - feature/production-installation-readiness
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-publication:
    name: Authenticated release publication (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q install tests/test_release_publication_ci.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Run isolated release installation regressions
        run: python -m unittest discover -s tests -p 'test_release_publication_ci.py' -v
