name: Release installation regression

on:
  push:
    branches:
      - feature/production-installation-readiness
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-publication:
    name: Authenticated release publication (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q install tests/test_release_publication_ci.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Run provisioning failure rollback tests
        run: python -m unittest discover -s tests -p 'test_provisioning_rollback_ci.py' -v
      - name: Run integrated provisioning preflight tests
        run: python -m unittest discover -s tests -p 'test_provisioning_preflight_ci.py' -v
      - name: Run isolated Python environment provisioning tests
        run: python -m unittest discover -s tests -p 'test_provision_python_ci.py' -v
      - name: Run staged application ownership tests
        run: python -m unittest discover -s tests -p 'test_prepare_ownership_ci.py' -v
      - name: Run offline environment provisioning tests
        run: python -m unittest discover -s tests -p 'test_provision_environment_ci.py' -v
      - name: Run offline systemd unit provisioning tests
        run: python -m unittest discover -s tests -p 'test_provision_service_units_ci.py' -v
      - name: Run read-only service provisioning checks
        run: python -m unittest discover -s tests -p 'test_service_provisioning_ci.py' -v
      - name: Run production entry-point safety regressions
        run: python -m unittest discover -s tests -p 'test_production_release_ci.py' -v
      - name: Run isolated configuration safety regressions
        run: python -m unittest discover -s tests -p 'test_install_configuration_ci.py' -v
      - name: Run isolated release installation regressions
        run: python -m unittest discover -s tests -p 'test_release_publication_ci.py' -v
