name: Fresh PostgreSQL installation

on:
  push:
    branches:
      - feature/production-installation-readiness
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-install:
    name: Isolated PostgreSQL installation and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_installer
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: remediation_install_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_installer -d remediation_install_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: '5432'
      PG_USER: ci_installer
      PG_PASSWORD: ci_disposable_password
      PG_DBNAME: remediation_install_ci_test
      SCAN_POLICY_TEST_DATABASE: remediation_install_ci_test
      PYTHONPATH: .
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL Python driver
        run: python -m pip install 'psycopg2-binary>=2.9,<3'
      - name: Validate installation manifest
        run: python install/database.py
      - name: Install into fresh disposable database
        run: >-
          python install/install_database.py
          --database remediation_install_ci_test
          --confirm-database remediation_install_ci_test
      - name: Verify reinstall is refused without changing existing tables
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import psycopg2

          env = dict(os.environ)
          command = [
              sys.executable, "install/install_database.py",
              "--database", "remediation_install_ci_test",
              "--confirm-database", "remediation_install_ci_test",
          ]
          with psycopg2.connect(
              host=env["PG_HOST"], port=env["PG_PORT"],
              user=env["PG_USER"], password=env["PG_PASSWORD"],
              dbname=env["PG_DBNAME"],
          ) as conn:
              with conn.cursor() as cursor:
                  cursor.execute(
                      "SELECT count(*) FROM information_schema.tables "
                      "WHERE table_schema = 'public' AND table_type = 'BASE TABLE'"
                  )
                  before = cursor.fetchone()[0]
          assert before > 0, "Initial installation created no tables"
          result = subprocess.run(command, capture_output=True, text=True, env=env)
          assert result.returncode != 0, "Installer accepted a nonempty database"
          assert "not empty" in result.stderr.lower(), result.stderr
          with psycopg2.connect(
              host=env["PG_HOST"], port=env["PG_PORT"],
              user=env["PG_USER"], password=env["PG_PASSWORD"],
              dbname=env["PG_DBNAME"],
          ) as conn:
              with conn.cursor() as cursor:
                  cursor.execute(
                      "SELECT count(*) FROM information_schema.tables "
                      "WHERE table_schema = 'public' AND table_type = 'BASE TABLE'"
                  )
                  after = cursor.fetchone()[0]
          assert after == before, (before, after)
          print("PASS: Reinstallation rejected and existing table count unchanged")
          PY
      - name: Verify protected database names are rejected
        run: |
          python - <<'PY'
          from install.database import validate_database_target
          for name in ("postgres", "template0", "template1", "security_portal"):
              try:
                  validate_database_target(name)
              except ValueError:
                  continue
              raise AssertionError(f"Protected database accepted: {name}")
          print("PASS: Protected database names rejected")
          PY
      - name: Run scan policy PostgreSQL integration test
        run: python -m unittest discover -s tests -p 'test_scan_policy_administration_postgres.py' -v
